  .sl { fill: #8EA3B8; }
  .sla { stroke: #8EA3B8; }
  .ink { fill: #E8EDEF; }
}
.ac { fill: #8A5300; }
.acs { fill: none; stroke: #8A5300; stroke-linecap: round; stroke-linejoin: round; }
.ar { fill: none; stroke: #8A5300; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
.ha { fill: #FBEFD9; }
@media (prefers-color-scheme: dark) { .ac { fill: #F2B755; } .acs, .ar { stroke: #F2B755; } .ha { fill: #3A2C12; } }
