<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 304" width="1200" height="304" role="img" aria-labelledby="af-how-t af-how-d">
<title id="af-how-t">How a specialist works</title>
<desc id="af-how-d">Four steps from left to right. One: your company.md, a single page about your products, customers, voice and limits. Two: a specialist, here support with a headset, reads it before starting. Three: the specialist picks one of its skill cards from a fan of three and runs it. Four: a person reviews the result and approves it with a green check.</desc>
