<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="il-design-t il-design-d">
<title id="il-design-t">Design specialist</title>
<desc id="il-design-d">A design specialist holds a paint palette and a brush in front of a layout grid with blocks for a header, an image and cards.</desc>
<style>
:root { color-scheme: light dark; }
.bd { fill: #F3F5F6; }
