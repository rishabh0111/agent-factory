  .pf { fill: #252D32; }
  .pl { stroke: #4E5B62; }
  .dk { fill: #343E44; }
  .dk2 { fill: #232A2E; }
  .gr { fill: #56646C; }
  .grs { stroke: #8C99A0; }
  .scr { fill: #0B0F11; }
  .mu { fill: #7D8A91; }
  .mus { stroke: #7D8A91; }
  .ok { fill: #5BD0A0; }
  .oks { fill: #13342A; }
  .okl { stroke: #5BD0A0; }
  .ck { stroke: #062118; }
  .no { fill: #FF8A7A; }
  .nos { fill: #3D1C18; }
  .sl { fill: #8EA3B8; }
  .sla { stroke: #8EA3B8; }
  .ink { fill: #E8EDEF; }
}
.ac { fill: #A0337C; }
.acs { fill: none; stroke: #A0337C; stroke-linecap: round; stroke-linejoin: round; }
.ar { fill: none; stroke: #A0337C; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
.ha { fill: #F6E3EF; }
@media (prefers-color-scheme: dark) { .ac { fill: #E58BC8; } .acs, .ar { stroke: #E58BC8; } .ha { fill: #361A2D; } }
</style>
