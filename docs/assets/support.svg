<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="il-support-t il-support-d">
<title id="il-support-t">Support specialist</title>
<desc id="il-support-d">A support specialist with a headset and a coffee mug works at a desk. Beside them, three support tickets are stacked, and the last one has a green check.</desc>
<style>
:root { color-scheme: light dark; }
.bd { fill: #F3F5F6; }
.pp { fill: #FFFFFF; stroke: #C9D1D6; stroke-width: 2; }
